<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JouwCarParts BMW</title>
<style>
body{margin:0;background:#111;color:#f4efe6;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#0c0c0c;padding:14px 16px;border-bottom:1px solid #333}
.wrap{max-width:1180px;margin:auto}
h1{margin:0;color:#c9a227;font-size:22px}
.sub{color:#9a9488;font-size:13px;margin:6px 0 10px}
.search{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#191919;color:#fff;font-size:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid #444;background:#191919;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip.on{background:#c9a227;color:#111;font-weight:700}
.count{color:#9a9488;margin-top:8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:16px;max-width:1180px;margin:auto}
.card{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:12px}
.badge{color:#c9a227;font-size:11px;margin-bottom:6px}
h2{font-size:14px;margin:0 0 8px;line-height:1.35}
.meta{color:#9a9488;font-size:12px;margin-bottom:8px}
a.btn,button{display:inline-block;margin:2px 4px 0 0;background:#c9a227;color:#111;border:0;border-radius:6px;padding:6px 9px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}
button{background:#2a2a2a;color:#c9a227}
section h3{max-width:1180px;margin:20px auto 0;padding:0 16px;color:#c9a227}
</style></head><body>
<header><div class="wrap">
<h1>JOUWCARPARTS</h1>
<p class="sub">BMW onderdelen — zoek op serie of model, of scroll.</p>
<input class="search" id="q" placeholder="Zoek 3 Serie, F10, voorbumper, SKU">
<div class="filters" id="series"></div>
<div class="filters" id="models"></div>
<div class="count"><span id="n">0</span> producten</div>
</div></header>
<div id="app"></div>
<script src="catalog.js"></script>
</body></html>
